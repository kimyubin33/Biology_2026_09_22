"bullets": ["단일 표적에 강하게 의존하면 선택적 억제가 유리할 수 있음", "다중 타깃: 의도한 표적 조합과 작용 강도를 설계", "무차별 결합은 선택적 다중 조절과 다름"], "scene": "targets", "formula": "효과 · 선택성 · 노출 · 안전성의 균형", "note": "의도한 표적 A/B와 피해야 할 표적 H를 구분", "script": "그렇다면 암이 아닌 질병은 단일 타깃으로 충분할까요? 질병의 이름만으로 결정할 수는 없습니다. 핵심 원인이 특정 기능에 집중되어 있고 그 기능을 조절하는 것만으로 충분한 효과를 얻는다면 단일 타깃 전략은 매우 합리적입니다. 암에서도 특정 표적에 강하게 의존하는 경우가 있습니다. 반대로 암이 아니더라도 여러 신경전달물질이나 대사 경로가 얽히면 복수 표적의 조절을 고려할 수 있습니다. 따라서 다중 타깃이 언제나 우월하거나 부작용이 적다고 말하면 안 됩니다. 필요한 표적 A와 B에 작용하면서 정상 조직에서 중요한 표적 H는 피하는 것이 목표입니다. 표적을 추가할 때 얻는 이득이 독성이나 조절의 어려움을 상쇄하는지 따져야 합니다.", "source": "A pp.4–5", "seconds": 80}, {"title": "한 분자의 다중 작용과 병용은 다르다", "sub": "같은 표적 조합도 구현 방식이 다르면 조절 가능성이 달라진다", "bullets": ["단일 분자: 분자 집단이 A와 B에 각각 결합", "병용: 서로 다른 약물의 용량을 독립적으로 조절", "단일 분자는 표적별 작용 비율을 따로 바꾸기 어려움"], "scene": "dual", "formula": "다중 타깃 단일 약물 ≠ 여러 약물의 병용", "note": "단일 분자 / 병용 버튼 비교", "script": "보고서를 읽을 때 특히 구분해야 하는 용어입니다. 다중 타깃 단일 약물은 한 종류의 분자가 두 개 이상의 표적을 조절하는 경우입니다. 이것은 한 분자 한 개가 멀리 떨어진 단백질 둘을 동시에 붙잡는다는 뜻이 아닙니다. 약물 분자들이 집단으로 존재하면서 어떤 분자는 A에, 다른 분자는 B에 결합할 수 있습니다. 병용은 서로 다른 약물을 함께 사용하는 전략입니다. 병용에서는 A 약물의 용량만 올리는 식의 조정이 가능하지만 약물 간 상호작용과 서로 다른 체내 거동을 고려해야 합니다. 단일 분자는 투여 구성이 단순해질 수 있으나 표적별 작용 비율이 구조와 노출에 묶입니다. 어느 방식이 나은지는 실험과 임상 맥락에 따라 판단해야 합니다.", "source": "A p.4 그림1·P1", "seconds": 85}, {"title": "결합은 농도와 친화도의 함수다", "sub": "같은 분자라도 표적마다 점유율이 다르다", "bullets": ["Kd가 작을수록 평형 결합 친화도가 높음", "점유율은 자유 약물 농도에 따라 증가", "결합 점유율과 치료 효과는 동일하지 않음"], "scene": "occupancy", "formula": "θ = [L] / (Kd + [L])", "note": "농도 슬라이더: A=10 nM, B=100 nM, H=1000 nM", "script": "다중 타깃 설계를 수식으로 연결해 보겠습니다. 단백질 P와 약물 L이 결합해서 PL을 만들고 다시 떨어지는 평형을 가정합니다. 해리상수 Kd는 자유 단백질과 자유 약물 농도의 곱을 복합체 농도로 나눈 값입니다. 같은 조건에서 Kd가 작으면 더 강한 결합을 뜻합니다. 전체 단백질 가운데 결합한 비율을 정리하면 화면의 점유율 식을 얻습니다. 농도가 Kd와 같을 때 점유율은 절반입니다. 여기서 A의 Kd를 10 나노몰, B를 100 나노몰로 정했습니다. 농도 100 나노몰에서 A는 약 91퍼센트, B는 50퍼센트가 점유됩니다. 농도를 더 올리면 피하려는 H의 점유도 올라갑니다. 그러므로 A에만 잘 붙는 분자를 찾는 것으로 문제가 끝나지 않습니다. 조직의 자유 농도, 작용 방식, 독성까지 연결해야 합니다.", "source": "보충 이론 / 단일 부위 평형 모형", "seconds": 101}, {"title": "AI는 분자를 숫자로 읽는다", "sub": "문자열 · 연결 그래프 · 공간 좌표", "bullets": ["SMILES: CC(O)C 같은 원자와 결합의 문자열", "그래프: 원자가 노드, 결합이 연결", "3D: 좌표와 입체 배치 / 여러 배좌가 가능"], "scene": "molecule", "formula": "G = (V, E)     X ∈ ℝⁿˣ³", "note": "분자 표현 버튼: 그래프 / 입체 / 원자 정보", "script": "AI에 분자를 넣으려면 숫자로 표현해야 합니다. 첫째는 SMILES입니다. 원소 기호와 괄호, 결합 기호 등을 사용해 분자 연결 구조를 문자열로 적습니다. 둘째는 그래프입니다. 각 원자를 노드로 만들고 결합을 연결로 표시하며, 원자 종류나 전하를 특성으로 저장합니다. 셋째는 3차원 좌표입니다. 원자마다 x, y, z를 저장하면 모양과 거리를 다룰 수 있습니다. 같은 연결 구조라도 단일 결합의 회전에 따라 여러 배좌가 생기므로 좌표 하나가 분자 전체를 대표한다고 단정하면 안 됩니다. 또 SMILES가 입체 정보를 전혀 담을 수 없다는 설명도 지나칩니다. 입체화학 표기는 가능하지만 완전한 공간 좌표를 직접 주지는 않습니다. 화면은 표현의 차이를 보여주는 개념 모형으로, 계산화학으로 최적화한 구조가 아닙니다.", "source": "A pp.6–7", "seconds": 85}, {"title": "예측모델과 생성모델의 역할이 다르다", "sub": "후보를 평가하는 함수와 후보를 만드는 분포", "bullets": ["예측: 주어진 분자의 활성·독성을 추정", "생성: 학습한 분포에서 새로운 구조를 샘플링", "생성물이 좋아지려면 평가모델도 신뢰할 수 있어야 함"], "scene": "pipeline", "formula": "예측: ŷ = f(x)     생성: x ~ pθ(x | c)", "note": "입력 분자 → 평가 / 조건 → 후보 생성", "script": "일반적으로 예측모델은 이미 주어진 분자를 평가합니다. 입력이 분자이고 출력은 활성이나 독성 점수입니다. 생성모델은 방향이 다릅니다. 학습한 화학 구조의 분포에서 후보를 만들어 냅니다. 조건 c에 표적이나 원하는 특성을 넣으면 조건부 생성이 됩니다. 하지만 새로운 구조가 나왔다는 사실과 좋은 약이라는 사실은 별개입니다. 생성모델은 화학적으로 그럴듯한 문자열을 만들 수 있어도 생체 내 효과를 보장하지 않습니다. 그래서 생성된 후보를 예측모델로 평가하고, 유망한 후보를 실험하는 과정이 필요합니다. 이때 평가모델이 잘못되면 생성모델은 그 잘못된 점수를 더 잘 받는 방향으로 발전할 수도 있습니다. 학습의 성공과 연구의 성공을 구분해야 하는 이유입니다.", "source": "A pp.7–9·B pp.3–4", "seconds": 80}, {"title": "VAE는 탐색 가능한 잠재공간을 만든다", "sub": "분자에서 분포로, 잠재 좌표에서 다시 분자로", "bullets": ["인코더가 평균 μ와 표준편차 σ를 추정", "샘플링한 z를 디코더가 분자로 복원", "복원 정확도와 잠재분포의 규칙성을 함께 학습"], "scene": "latent", "formula": "z = μ + σ ⊙ ε,   ε ~ N(0, I)", "note": "잠재 위치 슬라이더: 샘플링 위치 변화 / 가상 공간", "script": "변분 오토인코더, VAE는 분자를 잠재공간으로 압축하는 생성모델입니다. 일반 오토인코더처럼 입력을 압축했다 복원하지만, VAE는 입력마다 하나의 점만 내놓기보다 평균과 표준편차로 표현되는 분포를 만듭니다. 그 분포에서 잠재변수 z를 뽑아 디코더에 넣으면 분자가 생성됩니다. z를 평균 더하기 표준편차 곱하기 잡음으로 적는 재매개화 덕분에 학습 중 기울기를 전달할 수 있습니다. 학습에는 두 요구가 있습니다. 원래 분자를 잘 복원해야 하고, 잠재분포도 기준 분포와 너무 멀어지지 않아야 합니다. 그래야 입력을 외우는 것을 넘어 새로운 좌표를 샘플링하는 데 사용할 수 있습니다. 화면의 공간은 이해를 위한 가상 공간입니다. 실제 잠재공간은 차원이 훨씬 높고, 가까운 구조라도 활성이 급변하는 경우가 있습니다.", "source": "A p.7·P2", "seconds": 91}, {"title": "생성모델마다 장점과 비용이 있다", "sub": "문제에 맞는 표현과 학습법을 선택한다", "bullets": ["GAN: 생성자와 판별자의 경쟁 / 다양성 붕괴 위험", "RNN·Transformer: 토큰 순서 학습 / 문법·화학 검증 필요", "확산: 잡음 제거를 반복 / 다단계 샘플링 비용"], "scene": "diffusion", "formula": "xₜ = √ᾱₜ x₀ + √(1 − ᾱₜ) ε", "note": "잡음 슬라이더를 줄여 구조 복원 개념 확인", "script": "VAE 외에도 여러 생성모델이 있습니다. GAN에서는 생성자가 샘플을 만들고 판별자가 학습 데이터와 생성 샘플을 구별하도록 경쟁합니다. 그럴듯한 샘플을 만들 수 있지만 일부 형태만 반복하는 모드 붕괴가 문제가 될 수 있습니다. RNN과 Transformer는 SMILES의 다음 토큰을 예측하는 방식으로 분자를 생성할 수 있습니다. Transformer는 주의 기제로 토큰 간 관계를 계산하지만, 일반 언어모델을 쓴다고 화학적 타당성이 보장되지는 않습니다. 확산모델은 학습할 때 데이터에 잡음을 더하고, 그 잡음을 제거하는 방향을 배웁니다. 지금 슬라이더를 이동하면 잡음이 줄며 구조가 드러납니다. 실제 확산 추론을 실행하는 장면은 아니며 학습 원리를 표현한 것입니다. 세 모델 모두 목표 표적과 안전성 조건을 별도로 다루어야 합니다.", "source": "A pp.7–8·P3", "seconds": 90}, {"title": "좋은 분자는 여러 조건을 함께 만족한다", "sub": "평균 점수 하나가 약한 표적을 숨길 수 있다", "bullets": ["A 활성, B 활성, 합성 가능성을 함께 평가", "독성 위험은 패널티 또는 배제 조건으로 처리", "목표의 단위와 범위를 먼저 정규화"], "scene": "pareto", "formula": "R = wA·sA + wB·sB − λ·h", "note": "A 가중치와 독성 패널티 변경 / 가상 후보 6개", "script": "다중 목적 최적화의 핵심은 좋은 분자를 어떻게 정의하느냐입니다. A 활성 점수와 B 활성 점수가 높고 독성 위험 h는 낮아야 한다고 가정해 보겠습니다. 가장 간단한 방식은 점수를 가중합하는 것입니다. A를 중요하게 보는 정도를 올리면 A에 유리한 후보의 순위가 올라갑니다. 독성 패널티를 올리면 독성이 높은 후보는 불리해집니다. 그런데 평균이 높다는 이유로 한 표적이 거의 작동하지 않는 후보를 선택할 수도 있습니다. 두 표적 모두에 최소 기준을 두거나 작은 쪽의 점수를 보상하는 방법을 생각할 수 있습니다. 서로 다른 단위의 값을 그대로 더해서도 안 됩니다. 나노몰 농도와 0에서 1 사이 독성 점수는 먼저 해석 가능한 점수로 바꿔야 합니다. 화면의 후보 수치는 이 원리를 보여주기 위해 만든 값입니다.", "source": "A pp.8–9 / 교육용 보상식", "seconds": 96}, {"title": "강화학습은 높은 보상의 구조를 더 찾는다", "sub": "보상 설계가 탐색 방향을 결정한다", "bullets": ["상태: 부분 분자 또는 잠재 좌표", "행동: 토큰 추가 또는 탐색 분포 변경", "평가모델의 오류까지 최적화하는 보상 해킹에 주의"], "scene": "reward", "formula": "J(θ) = Eₓ~πθ [R(x)]", "note": "탐색 단계 버튼: 좋은 점수의 영역을 더 자주 선택", "script": "이제 두 번째 발표자가 생성 방향을 조절하는 방법을 설명하겠습니다. 강화학습에서는 정책이 행동을 선택하고 그 결과에 보상을 받습니다. 분자 생성에서는 부분 SMILES에서 다음 토큰을 고르거나 잠재공간의 탐색 위치를 바꾸는 방식으로 정의할 수 있습니다. 목표는 현재 정책이 생성하는 분자들의 기대 보상을 높이는 것입니다. 기존 지식에서 좋은 후보를 찾는 활용과 아직 덜 탐색한 영역을 조사하는 탐색 사이에 균형도 필요합니다. 화면의 단계 버튼은 좋은 점수를 얻는 영역으로 샘플이 집중되는 개념을 보여줍니다. 실제 신경망 학습은 아닙니다. 가장 중요한 한계는 보상에 사용한 예측모델입니다. 모델이 특정 비현실적인 구조에 높은 점수를 주면 생성기는 이를 반복해서 만들 수 있습니다. 따라서 점수 외에 구조 검증과 독립 평가가 필요합니다.", "source": "A pp.7–9·P1", "seconds": 90}, {"title": "파레토 최적해는 하나가 아닐 수 있다", "sub": "모든 목표에서 동시에 더 좋은 후보가 없는 경계", "bullets": ["다른 후보가 모든 목표에서 동등 이상이면 지배됨", "파레토 경계는 가치 판단 이전의 후보 집합", "최종 선택은 노출·안전성·합성·연구 목적에 의존"], "scene": "pareto", "formula": "x ≻ y: 모든 목표에서 ≥, 적어도 하나에서 >", "note": "붉은색: 독성 높음 / 테두리: 선택 후보", "script": "가중치를 하나로 정하지 않고 후보들을 비교하는 방법도 있습니다. 두 후보를 비교할 때 A와 B 활성은 모두 높고 독성은 더 낮은 후보가 있다면 그 후보가 다른 후보를 지배한다고 합니다. 어떤 다른 후보에게도 지배되지 않는 후보들의 집합이 파레토 경계입니다. 파레토 최적이라는 말은 모든 목표를 최고로 달성했다는 뜻이 아닙니다. 한 목표를 더 좋게 하려면 다른 목표를 희생해야 할 수 있다는 뜻입니다. 이 시각화는 A 활성, B 활성, 독성 위험이라는 세 축으로 후보를 배치합니다. 후보를 선택하면 개별 점수를 확인할 수 있습니다. 여기서 최종 선택은 컴퓨터가 자동으로 결정할 수 있는 순수한 수학 문제만은 아닙니다. 어떤 독성을 허용할지, 합성이 가능한지, 필요한 조직에 도달하는지를 함께 판단해야 합니다.", "source": "A pp.8–9 / 보충 최적화 이론", "seconds": 75}, {"title": "도킹은 결합 자세의 가설을 만든다", "sub": "점수가 좋아도 실제 친화도나 효과가 보장되지는 않는다", "bullets": ["단백질 포켓에 리간드의 위치·방향·배좌를 탐색", "스코어는 실제 자유에너지의 근사 평가", "단백질 유연성, 용매, 양성자화 상태가 중요"], "scene": "docking", "formula": "ΔG° = RT ln(Kd / C°)", "note": "리간드 위치 슬라이더 / 포켓은 개념 모형", "script": "도킹은 분자가 단백질의 어디에 어떤 자세로 들어갈지를 탐색하는 계산입니다. 위치와 방향을 바꾸고 경우에 따라 결합의 회전도 바꾸며 점수를 계산합니다. 잘 맞는 형태, 수소결합 가능성, 소수성 접촉 같은 요인을 근사적으로 평가합니다. 하지만 단백질은 고정된 돌덩어리가 아니며 물과 이온, 양성자화 상태도 결합을 바꿉니다. 따라서 도킹 점수는 실험 친화도와 같지 않습니다. 아래 식은 진짜 평형 결합 자유에너지와 해리상수의 열역학적 관계입니다. 도킹 점수를 이 식에 넣으면 정확한 Kd가 나온다고 해석하면 안 됩니다. 화면의 포켓과 리간드는 도킹 과정의 개념만 보여줍니다. 실제로는 구조 준비, 알려진 리간드의 재도킹, 비교군과 반복 검증이 필요합니다.", "source": "A p.7·P1 / 보충 열역학", "seconds": 90}, {"title": "POLYGON은 합성·실험으로 이어졌다", "sub": "보고서의 표보다 인용된 원논문의 방법과 결과를 우선한다", "bullets": ["VAE 잠재공간 + 생성 강화학습", "검증 사례: MEK1·mTOR / 32개 화합물 합성", "초기 이중 표적 활성의 근거이며 임상 효과 입증은 아님"], "scene": "dual", "formula": "원논문: Nature Communications 15, 3636 (2024)", "note": "보고서 표3의 표적·모델·개수와 원논문을 구분", "script": "이제 원논문이 제공하는 근거를 보겠습니다. 보고서가 인용한 Munson 등의 POLYGON 연구는 VAE 잠재공간과 생성 강화학습을 결합합니다. 두 표적에 대한 예상 활성과 약물 유사성, 합성 용이성을 평가해 탐색 방향을 바꿉니다. 연구진은 MEK1과 mTOR를 대상으로 32개 화합물을 합성하고 세포 및 생화학 실험을 수행했습니다. 따라서 컴퓨터가 제시한 분자를 실제로 만들어 이중 표적 작용을 확인했다는 점에 의미가 있습니다. 다만 보고서 표에 적힌 조건부 VAE와 베이지안 최적화, 표적 조합, 후보 개수를 이 논문의 결과로 그대로 발표하면 안 됩니다. 발표에서는 원논문에서 확인한 내용으로 정리했습니다. 또한 이 결과는 초기 후보 발굴의 근거입니다. 환자에서 치료 효과가 입증되었다거나 ADMET 최적화가 완료되었다는 뜻은 아닙니다.", "source": "P1 / A p.9 표3 대조", "seconds": 100}, {"title": "신경계 사례는 독성 표적까지 고려한다", "sub": "DAT·SERT·NET 활성과 hERG 위험을 구분한다", "bullets": ["의도한 작용: 수송체별 적절한 조절", "피해야 할 작용: hERG 억제 위험", "친화도 예측만으로 치료 효능을 단정할 수 없음"], "scene": "targets", "formula": "maximize target profile, subject to safety constraints", "note": "hERG는 여기서 회피할 위험 표적", "script": "다중 타깃은 암에만 해당하는 접근이 아닙니다. 보고서는 약물중독 관련 사례에서 도파민, 세로토닌, 노르에피네프린 수송체인 DAT, SERT, NET를 소개합니다. 이들을 조절하는 프로파일을 고려하면서 심장 독성 위험과 관련된 hERG 억제도 평가한다는 점이 중요합니다. 그러나 수송체에 강하게 결합한다는 사실만으로 중독 치료 효과가 생긴다고 해석할 수는 없습니다. 억제인지 다른 조절인지, 뇌에 도달하는지, 행동 수준의 결과가 어떤지를 확인해야 합니다. 인용된 Feng 연구는 상호작용 네트워크를 바탕으로 예측모델과 재창출 가능성을 분석한 연구입니다. 보고서의 RNN과 강화학습으로 15개 후보를 만들었다는 요약과 동일한 실험이라고 단정하지 않겠습니다. 핵심 교훈은 목표 활성을 높이는 것과 위험 표적을 회피하는 것을 함께 설계한다는 점입니다.", "source": "A p.9·P4", "seconds": 80}, {"title": "기업은 서로 다른 단계에 AI를 적용한다", "sub": "회사 이름보다 입력·출력·검증 단계를 비교한다", "bullets": ["Insilico: 분자 생성과 후보 최적화", "Recursion: 세포 이미지의 표현형 분석", "DeepMind: 단백질·복합체 구조 예측", "Atomwise: 구조 기반 가상 스크리닝"], "scene": "industry", "formula": "후보 발굴 시간 단축 ≠ 전체 신약 개발 완료", "note": "기업 사례는 첨부 보고서의 2025년 서술 기준", "script": "두 번째 보고서는 기업의 활용 범위를 넓게 보여줍니다. 이를 같은 종류의 AI라고 묶기보다 어떤 데이터를 넣고 무엇을 얻는지 비교하면 이해가 쉽습니다. Insilico는 분자 생성과 후보 최적화의 예로, Recursion은 대규모 세포 이미지에서 표현형을 분석하는 예로 볼 수 있습니다. DeepMind의 구조 예측은 표적과 복합체를 이해하는 데 쓰이고, Atomwise의 구조 기반 스크리닝은 이미 있는 후보들의 우선순위를 정하는 데 연결됩니다. 이들은 연결될 수 있지만 서로 같은 일을 하지는 않습니다. 또 보고서의 짧은 발굴 기간이나 적은 계산비용을 신약 전체의 개발 기간과 총비용으로 바꾸어 말하면 안 됩니다. 합성, 독성, 임상시험이 추가로 필요합니다. 이 장은 보고서가 작성된 시점의 사례 비교이며 현재 기업의 임상 진행 상황을 의미하지 않습니다.", "source": "B pp.6–8", "seconds": 85}, {"title": "예측 성능은 데이터 분할에서 시작된다", "sub": "비슷한 분자가 학습·시험에 섞이면 과대평가될 수 있다", "bullets": ["무작위 분할과 스캐폴드 분할을 비교", "학습되지 않은 화학 영역에서 불확실성 확인", "결측 활성은 음성 데이터로 바꾸지 않음"], "scene": "split", "formula": "평가: MAE / PR-AUC / 적중률 / 불확실성", "note": "같은 색: 유사 골격 / 분할 방식 버튼 비교", "script": "좋은 성능 숫자를 봤을 때 먼저 물어야 할 것은 시험 데이터가 얼마나 새로운가입니다. 거의 같은 골격을 가진 분자가 학습 데이터와 시험 데이터에 모두 있으면 익숙한 구조를 다시 맞히는 시험이 될 수 있습니다. 무작위 분할 외에 골격을 기준으로 나누는 스캐폴드 분할이나 시간 순서 분할을 고려해야 합니다. 활성값은 단위와 측정 조건도 확인해야 합니다. IC50, Ki, Kd는 서로 다른 의미이고 측정되지 않은 활성은 비활성을 뜻하지 않습니다. 활성 회귀에는 평균 절대오차를, 양성 후보가 적은 분류에는 정밀도와 재현율의 관계를 살펴볼 수 있습니다. 숫자 하나만 보고 모델을 선택하기보다 실제로 새 화학 영역에서 어느 정도 틀리고 얼마나 불확실한지 확인해야 합니다.", "source": "A p.3·10 / 보충 검증 설계", "seconds": 90}, {"title": "집 컴퓨터에서는 최적화 원리를 검증한다", "sub": "6개 가상 후보로 조건 변화와 선택 결과를 재현한다", "bullets": ["실험 1: A 가중치 0.2 / 0.5 / 0.8 비교", "실험 2: 독성 패널티 0 / 0.5 / 1 비교", "기록: 선택 후보·개별 점수·보상 / CSV 내려받기"], "scene": "pareto", "formula": "R = w·sA + (1 − w)·sB − λ·h", "note": "신약 재현 실험이 아닌 다중 목적 최적화 실습", "script": "발표 현장에서 직접 할 수 있는 작은 실험입니다. 고정된 가상 후보 여섯 개에 A 활성, B 활성, 독성 위험 점수를 부여했습니다. 먼저 독성 패널티를 고정하고 A의 가중치를 낮음, 중간, 높음으로 바꿉니다. 후보 순위가 어떻게 달라지는지 확인합니다. 다음에는 가중치를 고정하고 독성 패널티를 바꿉니다. 높은 활성과 높은 독성을 함께 가진 후보가 언제 탈락하는지 관찰할 수 있습니다. CSV 버튼을 누르면 현재 조건과 모든 후보의 점수를 기록할 수 있습니다. 이 실습은 생성모델이나 실제 신약 논문을 재현한 실험이 아닙니다. 최적화 기준이 바뀌면 선택 결과가 달라진다는 원리를 검증하는 실험입니다. 실제 연구로 확장하려면 공개 활성 데이터를 정리하고 독립 시험 세트에서 예측모델을 검증한 뒤 생성모델과 연결해야 합니다.", "source": "교육용 직접 계산 / A pp.8–9", "seconds": 106}, {"title": "다음 연구는 비교군과 실패 기준이 필요하다", "sub": "AI가 어떤 단계에서 얼마나 도움이 되는지 측정한다", "bullets": ["가설: 이중 표적 기준이 단일 기준보다 균형 후보를 더 찾음", "비교: 무작위 선택 / 단일 표적 / 다중 표적", "통제: 같은 후보 집합, 같은 평가 예산", "검증: 활성·정상세포 독성·노출·후속 최적화"], "scene": "pipeline", "formula": "성과 = 이중 기준 통과 후보 수 / 평가한 후보 수", "note": "실험 제안 / 수행 결과가 아님", "script": "강의에서 요구하는 공학적 관점으로 확장하면, 더 멋진 그림보다 공정한 비교가 필요합니다. 가설은 이중 표적 기준이 단일 표적 기준보다 균형 있는 후보를 더 많이 선택하는가로 세울 수 있습니다. 같은 후보 집합과 같은 평가 예산에서 무작위 선택, 단일 표적 최적화, 다중 표적 최적화를 비교합니다. 결과는 두 표적 기준을 모두 통과한 비율, 독성 기준을 통과한 비율, 구조 다양성으로 기록합니다. 기대한 이득이 없으면 보상함수나 예측모델을 다시 검토합니다. 이후에는 실제 합성 가능성을 function ball(x,y,z,r,c,name){let m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),new THREE.MeshStandardMaterial({color:c,roughness:.34,metalness:.15}));m.position.set(x,y,z);group.add(m);if(name){m.userData={name};clickables.push(m)}return m}
function line(a,b,c=C.gray,r=.027){let d=b.clone().sub(a),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),new THREE.MeshStandardMaterial({color:c}));m.position.copy(a.clone().add(b).multiplyScalar(.5));m.quaternion.setFromUnitVectors(V(0,1),d.normalize());group.add(m);return m}
function label(text,x,y,z=0,color='#344f61',scale=1){let c=document.createElement('canvas');c.width=512;c.height=96;let ctx=c.getContext('2d');ctx.font='500 38px Arial';let fs=38;while(ctx.measureText(text).width>490&&fs>16){ctx.font='500 '+(--fs)+'px Arial'}ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,256,61);let tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;let m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));m.position.set(x,y,z);m.scale.set(3.6*scale,.675*scale,1);group.add(m);return m}
function ring(x,y,z,r,c){let m=new THREE.Mesh(new THREE.TorusGeometry(r,.045,8,64),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);group.add(m);return m}
function molecule(x=0,y=0,z=0,flat=false){let ps=[];for(let i=0;i<10;i++){let p=V(x+Math.cos(i*.83)*1.45,y+Math.sin(i*.83)*1.0,z+(flat?0:Math.sin(i*1.72)*.8));ps.push(p);ball(p.x,p.y,p.z,.19,i%5===0?C.red:i%3===0?C.blue:C.gold,i%5===0?'O: oxygen':i%3===0?'N: nitrogen':'C: carbon')}for(let i=1;i<ps.length;i++)line(ps[i-1],ps[i],C.gray,.065);return ps}
const candidates=[{id:'A',a:.95,b:.25,h:.08},{id:'B',a:.8,b:.75,h:.25},{id:'C',a:.62,b:.88,h:.12},{id:'D',a:.92,b:.9,h:.85},{id:'E',a:.52,b:.58,h:.05},{id:'F',a:.65,b:.5,h:.3}];
function scores(){return candidates.map(c=>({...c,r:view.w*c.a+(1-view.w)*c.b-view.lambda*c.h})).sort((a,b)=>b.r-a.r)}
function csv(){let rows=['candidate,sA,sB,hERG_risk,wA,lambda,reward,data_type',...scores().map(c=>[c.id,c.a,c.b,c.h,view.w,view.lambda,c.r.toFixed(4),'synthetic'].join(','))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='multi_target_simulation.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function pareto(){line(V(-3,-1.9,1.8),V(3,-1.9,1.8),C.cyan);line(V(-3,-1.9,1.8),V(-3,2,1.8),C.blue);line(V(-3,-1.9,1.8),V(-3,-1.9,-2),C.red);label('A activity',1,-2.2,1.8);label('B activity',-3,2.45,1.8);label('hERG risk',-3,-1.9,-2.7);label('0',-3.2,-2.1,1.8,'#526b7b',.6);label('1',3.1,-1.8,1.8,'#526b7b',.6);label('1',-3,2.1,1.8,'#526b7b',.6);label('1',-3,-1.8,-2,'#526b7b',.6);let best=scores()[0];candidates.forEach(c=>{let x=-3+c.a*6,y=-1.9+c.b*3.9,z=1.8-c.h*3.8;let m=ball(x,y,z,.18+(c.id===best.id?.09:0),view.frontier&&c.id==='F'?C.gray:c.h>.5?C.red:C.cyan,`${c.id}: A=${c.a}, B=${c.b}, risk=${c.h}`);label(c.id,x,y+.4,z);if(c.id===best.id)ring(x,y,z,.39,C.gold)});setRead(`선택 <b>${best.id}</b> · A ${best.a} / B ${best.b} / 위험 ${best.h}<br>w=${view.w.toFixed(2)}, λ=${view.lambda.toFixed(2)} · 보상 ${best.r.toFixed(3)} <small>(가상 데이터)</small>${view.frontier?' · 비지배 A/B/C/D/E':''}`)}
function build(){if(!renderer)return;clear();let type=slides[index].scene;group.rotation.set(.1,-.17,0);camera.position.set(0,0,9.8);camera.lookAt(0,0,0);$('visualTag').textContent='3D CONCEPT MODEL · 실측 구조 아님';setRead('드래그하여 회전하고, 휠로 확대해 보세요.');
if(type==='network'){let ps=[V(-3,0),V(-1.2,1.3),V(-1.2,-1.3),V(1.3,1.3),V(1.3,-1.3),V(3,0)];[[0,1],[1,3],[3,5],[0,2],[2,4],[4,5]].forEach(([a,b],i)=>line(ps[a],ps[b],(i<3?view.a:view.b)?C.gray:C.cyan,.055));ps.forEach((p,i)=>ball(p.x,p.y,0,.29,((i===1||i===3)&&view.a)||((i===2||i===4)&&view.b)?C.gray:C.cyan,['Input','A','B','A output','B output','Cell output'][i]));label('INPUT',-3,-.65);label('A',-1.2,1.9);label('B',-1.2,-2);label('OUTPUT',3,-.65);let a=view.a?.1:.8,b=view.b?.1:.8;setRead(`A 잔류 ${a.toFixed(1)} · B 잔류 ${b.toFixed(1)}<br>개념 출력 S = ${(1-(1-a)*(1-b)).toFixed(2)} (효능 측정값 아님)`)}
else if(type==='targets'||type==='occupancy'){let vals=[['Target A',-2.5,10,C.cyan],['Target B',0,100,C.blue],['Avoid H',2.5,1000,C.red]];vals.forEach(([t,x,k,c])=>{let frac=type==='occupancy'?view.conc/(k+view.conc):.5;ring(x,0,0,.85,c);ball(x,0,0,.42,c,t);for(let j=0;j<20;j++){let angle=j*Math.PI/10;ball(x+Math.cos(angle)*.85,Math.sin(angle)*.85,.1,.08,j<Math.round(frac*20)?C.gold:C.gray)}label(t,x,1.6,0);if(type==='occupancy')label((frac*100).toFixed(1)+'%',x,-1.55,0)});if(type==='occupancy')setRead(`자유 농도 [L] = ${view.conc} nM<br>A ${(100*view.conc/(10+view.conc)).toFixed(1)}% · B ${(100*view.conc/(100+view.conc)).toFixed(1)}% · H ${(100*view.conc/(1000+view.conc)).toFixed(1)}%`);else setRead('A·B: 의도한 표적 / H: 회피할 표적<br>결합 여부 외에 작용 방식과 노출을 검증해야 합니다.')}
else if(type==='dual'){ball(-2,1,0,.75,C.cyan);ball(2,1,0,.75,C.blue);label(index===14?'MEK1':'Target A',-2,2);label(index===14?'mTOR':'Target B',2,2);molecule(-1.9,-1,0,true);molecule(1.9,-1,0,true);if(view.dual){group.children.filter(o=>o.isMesh&&o.material.color?.getHex()===C.gold&&o.position.x>0).forEach(o=>o.material.color.set(C.purple))}label(view.dual?'Drug 1 + Drug 2':'Same compound, many molecules',0,-2.2,0,'#795d27',1.4);setRead(view.dual?'병용: 약물 종류가 다르므로 용량을 따로 조절 가능':'단일 분자 다중 작용: 같은 종류의 분자들이 각각의 표적에 결합')}
else if(type==='molecule'||type==='hero'){molecule(0,0,0,view.split);if(type==='hero'){ring(0,0,-.6,2.5,C.cyan);label('DESIGN  /  TEST  /  LEARN',0,-2.4,0,'#346b72',1.3)}else{label(view.split?'CONNECTIVITY GRAPH':'3D CONFORMATION',0,2.2,0,'#456b80',1.3);setRead('금색: 원자 개념 / 연결: 결합 개념<br>원자 클릭으로 선택 정보 확인 · 실제 배좌 계산 아님')}}
else if(type==='latent'||type==='reward'){for(let i=0;i<110;i++){let x=Math.sin(i*1.79)*3,y=Math.cos(i*2.67)*1.9,z=Math.sin(i*.69)*1.4;let focus=type==='reward'?view.step/6:0;x=x*(1-focus*.65)+focus;ball(x,y*(1-focus*.55),z,.045,i%3===0?C.gold:C.cyan)}let x=type==='latent'?view.z:1;ball(x,0,0,.22,C.gold,'selected latent point');ring(x,0,0,.44,C.gold);label('LATENT SPACE',0,2.45,0,'#346b72',1.25);setRead(type==='latent'?`선택한 잠재 좌표 z₁ = ${view.z.toFixed(1)}<br>실제 학습 공간이 아닌 잠재 탐색의 개념 표현`:`탐색 단계 ${view.step} / 5 · 고득점 영역에 샘플 집중<br>정책 학습 대신 위치 변화를 시연하는 모형`)}
else if(type==='diffusion'){for(let i=0;i<50;i++){let a=i*.5,n=view.noise;ball(Math.cos(a)*1.6+(Math.sin(i*3.14)*3)*n,Math.sin(a)*1.2+Math.cos(i*5.2)*1.5*n,Math.sin(a*2)*.7+Math.sin(i*7.1)*2*n,.1,i%5?C.cyan:C.gold)}setRead(`잡음 비율 ${(view.noise*100).toFixed(0)}%<br>잡음 제거의 교육용 보간 / 실제 확산모델 추론 아님`)}
else if(type==='pareto'){group.rotation.set(.17,-.35,0);pareto();if(view.frontier)setRead('비지배 후보: A · B · C · D · E<br>F는 B에 지배됨 · 금색 고리: 가중합 선택 후보');$('visualTag').textContent='SYNTHETIC CANDIDATES · 가상 후보'}
else if(type==='docking'){for(let i=0;i<65;i++){let a=i*2.4,z=(i%9-4)*.3;ball(Math.cos(a)*1.45,Math.sin(a)*1.45,z,.18,C.cyan)}molecule(view.position,0,0,true);setRead(`리간드 이동 ${view.position.toFixed(1)} (임의 단위)<br>표면의 형태 적합성을 설명하는 모형 / 도킹 계산 아님`)}
else if(type==='split'){for(let i=0;i<48;i++){let k=i%4,x=view.split?(k<2?-2:2):(i<24?-2:2);let y=((i%12)-5.5)*.32;ball(x+Math.sin(i*1.2)*.7,y,Math.cos(i)*.6,.12,[C.cyan,C.gold,C.blue,C.red][k])}label('TRAIN',-2,2.35);label('TEST',2,2.35);setRead(view.split?'골격 분할: 유사 골격을 같은 집합에 배치':'무작위 분할: 같은 색의 유사 골격이 양쪽에 섞임')}
else{let names=type==='industry'?['GENERATION','PHENOTYPE','STRUCTURE','SCREENING']:type==='road'?['BIOLOGY','MODELS','OBJECTIVES','EVIDENCE']:type==='refs'?['REPORT A','REPORT B','COURSE','PAPERS']:['DESIGN','GENERATE','EVALUATE','TEST'];let ps=[V(-2,1.1),V(2,1.1),V(2,-1.3),V(-2,-1.3)];ps.forEach((p,i)=>{ball(p.x,p.y,0,.4,[C.cyan,C.gold,C.blue,C.purple][i]);label(names[i],p.x,p.y+.62,0,'#456477',.9);line(p,ps[(i+1)%4],C.gray,.035)});setRead(type==='refs'?'하단 출처 번호는 대본과 학습서에 연결됩니다.':'입력과 출력, 그리고 검증 단계를 연결해서 이해합니다.')}
}
function controls(){ $('controls').innerHTML='';let t=slides[index].scene;if(t==='network'){button(view.a?'A 복구':'A 억제',()=>{view.a=!view.a;controls();build()});button(view.b?'B 복구':'B 억제',()=>{view.b=!view.b;controls();build()})}if(t==='dual')button(view.dual?'단일 분자로 보기':'병용과 비교',()=>{view.dual=!view.dual;controls();build()});if(t==='occupancy')slider('농도 nM',1,1500,1,'conc');if(t==='molecule')button(view.split?'입체 표현':'평면 그래프',()=>{view.split=!view.split;controls();build()});if(t==='latent')slider('잠재 위치',-2.5,2.5,.1,'z');if(t==='diffusion')slider('잡음',0,1,.01,'noise');if(t==='reward')button('탐색 단계 +1',()=>{view.step=(view.step+1)%6;build()});if(t==='pareto'){slider('A 가중치',0,1,.05,'w');slider('독성 λ',0,1,.05,'lambda');if(index!==12)button('CSV 기록',csv);if(index===12)button(view.frontier?'전체 후보':'파레토',()=>{view.frontier=!view.frontier;controls();build()})}if(t==='docking')slider('리간드 위치',-2.5,2.5,.1,'position');if(t==='split')button(view.split?'무작위 분할':'스캐폴드 분할',()=>{view.split=!view.split;controls();build()});if(t==='refs')Object.entries(DATA.refs).filter(([k])=>k!=='C').forEach(([k,v])=>{let match=v.match(/https:\/\/\S+/);if(match)button(k+' 원문',()=>window.open(match[0],'_blank','noopener'))})}
function resetView(){view={a:false,b:false,dual:false,conc:100,w:.5,lambda:.5,noise:.65,z:0,step:0,position:0,split:false,frontier:false};controls();build()}
function show(n){index=Math.max(0,Math.min(slides.length-1,n));let s=slides[index];$('title').textContent=s.title;$('sub').textContent=s.sub;$('bullets').replaceChildren(...s.bullets.map(x=>{let li=document.createElement('li');li.textContent=x;return li}));$('formula').textContent=s.formula;$('note').textContent=s.note;$('source').textContent='출처: '+s.source;$('counter').textContent=`${index+1} / ${slides.length}`;$('progress').style.width=((index+1)/slides.length*100)+'%';let start=slides.slice(0,index).reduce((a,b)=>a+b.seconds,0);$('timing').textContent=`${index<11?'발표자 1':'발표자 2'} · ${fmt(start)}–${fmt(start+s.seconds)} · ${s.seconds}초`;$('notesTitle').textContent=`${index+1}. ${s.title.replace('\n',' ')}`;$('notesText').textContent='[조작] '+s.note+'\n\n'+s.script;$('overview').style.display='none';resetView();location.hash='slide-'+(index+1)}
$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('reset').onclick=resetView;$('motion').onclick=()=>{rotation=!rotation;$('motion').textContent=rotation?'자동 회전 켬':'자동 회전 끔'};const toggleNotes=()=>$('notes').style.display=$('notes').style.display==='block'?'none':'block';$('notesBtn').onclick=toggleNotes;$('closeNotes').onclick=toggleNotes;const overview=()=>$('overview').style.display=$('overview').style.display==='grid'?'none':'grid';$('overviewBtn').onclick=overview;const fullscreen=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('full').onclick=fullscreen;$('clock').onclick=()=>{running=!running;$('clock').textContent=running?'타이머 일시정지':'타이머 계속'};
slides.forEach((s,i)=>{let b=document.createElement('button');b.innerHTML=`${String(i+1).padStart(2,'0')}. ${s.title.replace('\n',' ')}<br><span class="time">${s.seconds}초</span>`;b.onclick=()=>show(i);$('overview').appendChild(b)});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&['arrowright','arrowleft',' ','pageup','pagedown'].includes(k))return;if(['arrowright','pagedown',' '].includes(k)){e.preventDefault();show(index+1)}if(['arrowleft','pageup'].includes(k)){e.preventDefault();show(index-1)}if(k==='n')toggleNotes();if(k==='o')overview();if(k==='f')fullscreen();if(k==='escape'){$('notes').style.display='none';$('overview').style.display='none'}});
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(772,484);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('viz').appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,772/484,.1,100);scene.add(new THREE.HemisphereLight(0xffffff,0x53616d,1.7));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,6);scene.add(light);group=new THREE.Group();scene.add(group);let down=null;renderer.domElement.onpointerdown=e=>{down={x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;group.rotation.y+=dx*.009;group.rotation.x+=dy*.009;if(Math.abs(dx)+Math.abs(dy)>2)down.moved=true;down.x=e.clientX;down.y=e.clientY};renderer.domElement.onpointerup=e=>{if(down&&!down.moved){let r=renderer.domElement.getBoundingClientRect(),p=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(p,camera);let hit=ray.intersectObjects(clickables)[0];if(hit)setRead('선택: '+hit.object.userData.name)}down=null};renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.z=THREE.MathUtils.clamp(camera.position.z+e.deltaY*.007,5.5,16) };}catch(e){$('viz').insertAdjacentHTML('beforeend','<div id="error">WebGL을 사용할 수 없습니다.<br>Chrome/Edge의 그래픽 가속을 켜거나 발표 PDF를 이용하세요.<br>본문과 대본 탐색은 계속 사용할 수 있습니다.</div>')}
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.1,(now-last)/1000);last=now;if(renderer){if(rotation)group.rotation.y+=dt*.13;renderer.render(scene,camera)}if(running)elapsed+=dt;$('timer').textContent=fmt(Math.floor(elapsed))+' / 30:00'}show(Math.max(0,(parseInt(location.hash.replace('#slide-',''))||1)-1));requestAnimationFrame(animate);window.DECK={show,slides,view:()=>view,renderer:()=>renderer};
</script></body></html>
